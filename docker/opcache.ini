; Apartar — OPcache.
;
; validate_timestamps=1 es el valor de desarrollo: el contenedor monta el
; código del host y un cambio debe verse sin reiniciar. El apagado
; (validate_timestamps=0) pertenece a la imagen de producción y entra con
; T-087 junto a `optimize` (REQ-INF-004 RB-6, REQ-INF-006 RB-3).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

opcache.jit = disable
