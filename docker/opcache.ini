; Apartar — OPcache.
opcache.enable = 1

; Encendido también en CLI desde `T-003b`, y ahí es donde más se nota: la suite
; corre un proceso por núcleo y cada uno compila el framework entero antes de
; ejecutar su primer test. Medido sobre la suite en paralelo, **271 s → 218 s**
; (−20 %) sin tocar un solo test. El worker de colas y los comandos de artisan
; se benefician igual.
;
; **Sin `opcache.file_cache`**, y eso se midió también: con la caché en disco
; la segunda vuelta tardó lo mismo que la primera (217 s frente a 219 s), así
; que no aporta nada — y sí traería un riesgo real, porque persistir opcodes
; entre procesos invita a apagar `validate_timestamps` y entonces una
; ejecución puede correr contra código que ya se editó.
opcache.enable_cli = 1

; `validate_timestamps=1` es el valor de desarrollo: el contenedor monta el
; código del host y un cambio debe verse sin reiniciar. El apagado
; (validate_timestamps=0) pertenece a la imagen de producción y entra con
; T-087 junto a `optimize` (REQ-INF-004 RB-6, REQ-INF-006 RB-3).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

opcache.jit = disable
