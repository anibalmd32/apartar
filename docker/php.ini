; Apartar — ajustes de PHP comunes a app, queue y reverb.
; La zona horaria de la aplicación la fija APP_TIMEZONE (REQ-INF-004 RB-2);
; esta es la del intérprete, para que coincidan los logs del sistema.
date.timezone = UTC

memory_limit = 512M
max_execution_time = 120

; Comprobantes hasta 5 MB (REQ-PAY-002 RB-5) e imágenes de producto hasta
; 8 MB con 10 por producto (REQ-CAT-005 RB-5): margen holgado por encima.
upload_max_filesize = 16M
post_max_size = 128M
max_file_uploads = 25

expose_php = Off
log_errors = On
error_log = /dev/stderr
display_errors = Off

realpath_cache_size = 4096k
realpath_cache_ttl = 600

; pcov solo se activa cuando la suite pide cobertura; el resto del tiempo su
; coste es nulo (REQ-QAX-003 RB-1).
pcov.enabled = 0
pcov.directory = /var/www/html/app
