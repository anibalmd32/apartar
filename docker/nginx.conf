# Apartar — nginx delante de PHP-FPM (REQ-INF-001).
# En local publica 8080:80 sin TLS; el proxy y los certificados son T-087.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Imágenes de producto (8 MB) y comprobantes (5 MB) con margen.
    client_max_body_size 128M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # REQ-INF-002 RB-8: los archivos privados (comprobantes) se sirven desde la
    # aplicación, nunca como estático. storage/ no se expone aquí.
    location ^~ /storage/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;
}
