<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartel fosforescente</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;background:#2a2b2e;font-family:Archivo,sans-serif;overflow:hidden;position:relative}
  nav{position:absolute;top:0;left:0;right:0;display:flex;gap:32px;align-items:center;padding:22px 48px;color:#fff;font-weight:700;font-size:17px}
  nav .logo{font-weight:900;font-variation-settings:'wdth' 70;font-size:32px;color:#f2ff2e}
  nav .sp{flex:1}
  .card{position:absolute;box-shadow:0 18px 30px -12px rgba(0,0,0,.6)}
  .y{left:70px;top:110px;width:860px;height:560px;background:#f2ff2e;transform:rotate(-1.5deg);padding:46px 54px}
  .y h1{font-variation-settings:'wdth' 64;font-weight:900;font-size:150px;line-height:.84;text-transform:uppercase;color:#111}
  .y p{margin-top:26px;font-size:24px;width:560px;font-weight:600;color:#111}
  .y .btn{position:absolute;left:54px;bottom:46px;background:#111;color:#f2ff2e;font-weight:900;font-size:24px;padding:20px 30px}
  .tape{position:absolute;width:120px;height:34px;background:rgba(255,255,255,.55)}
  .p{left:980px;top:150px;width:380px;height:300px;background:#ff3d8b;transform:rotate(3deg);padding:30px;font-family:'Gochi Hand';font-size:40px;color:#111;line-height:1.1}
  .p b{display:block;font-family:Archivo;font-variation-settings:'wdth' 64;font-weight:900;font-size:110px}
  .g{left:1000px;top:500px;width:340px;height:260px;background:#3dff8a;transform:rotate(-4deg);padding:28px;font-family:'Gochi Hand';font-size:34px;color:#111}
  .star{position:absolute;left:820px;top:540px;width:210px;height:210px;background:#ff8a1f;clip-path:polygon(50% 0,61% 32%,95% 20%,72% 48%,100% 70%,64% 70%,58% 100%,45% 72%,12% 92%,30% 62%,0 40%,36% 36%);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px;color:#111}
</style>
</head>
<body>
  <nav><span class="logo">apartar</span><span class="sp"></span><span>Cómo funciona</span><span>Precios</span><span>Entrar</span></nav>
  <div class="card y"><span class="tape" style="left:380px;top:-14px"></span><h1>Se aparta con inicial</h1><p>Tu catálogo en un enlace. Tus clientes apartan y te pagan en cuotas, en $ o Bs. a la tasa del día.</p><span class="btn">CREAR MI CATÁLOGO GRATIS</span></div>
  <div class="card p"><span class="tape" style="left:130px;top:-14px"></span>Inicial<b>$12</b>y 3 cuotas de $12</div>
  <div class="card g">Tasa BCV hoy<br>Bs. 889,58</div>
  <div class="star">30%</div>
</body>
</html>
