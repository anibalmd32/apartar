services:
  app:
    mem_limit: 3g
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  queue:
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  reverb:
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  nginx:
    volumes:
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage/app:ro
