services:
  app:
    mem_limit: 3g
    environment:
      DB_TEST_HOST: mysql_test
      DB_TEST_PORT: 3306
    depends_on:
      mysql_test:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  queue:
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  reverb:
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  nginx:
    volumes:
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage/app:ro

  mysql:
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  mysql_test:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 1536m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=2
      - --skip-innodb-doublewrite
      - --innodb-redo-log-capacity=67108864
      - --innodb-buffer-pool-size=268435456
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: apartar_testing
      MYSQL_USER: apartar
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql:size=1g,mode=1777
    volumes:
      - ./docker/mysql-test/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - apartar
