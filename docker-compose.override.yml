services:
  app:
    build:
      args:
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8081
        VITE_REVERB_SCHEME: http
    environment:
      APP_URL: http://localhost:8080
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: apartar
      DB_USERNAME: apartar
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: reverb
      REVERB_PORT: 8080

  queue:
    build:
      args:
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8081
        VITE_REVERB_SCHEME: http
    environment:
      APP_URL: http://localhost:8080
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: apartar
      DB_USERNAME: apartar
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: reverb
      REVERB_PORT: 8080

  reverb:
    build:
      args:
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8081
        VITE_REVERB_SCHEME: http
    environment:
      APP_URL: http://localhost:8080
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: apartar
      DB_USERNAME: apartar
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8081:8080"

  nginx:
    build:
      args:
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8081
        VITE_REVERB_SCHEME: http
    ports:
      - "8080:80"

  mysql:
    environment:
      MYSQL_DATABASE: apartar
      MYSQL_USER: apartar
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  redis:
    ports:
      - "6380:6379"

  node:
    ports:
      - "5173:5173"
