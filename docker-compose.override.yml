services:
  app:
    mem_limit: 3g
    environment:
      DB_TEST_HOST: mysql_test
    depends_on:
      mysql_test:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  nginx:
    ports:
      - "8080:80"

  mysql:
    ports:
      - "3307:3306"

  mysql_test:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 1536m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=2
      - --skip-innodb-doublewrite
      - --innodb-redo-log-capacity=67108864
      - --innodb-buffer-pool-size=268435456
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: apartar_testing
      MYSQL_USER: "${DB_USERNAME:-apartar}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    tmpfs:
      - /var/lib/mysql:size=1g,mode=1777
    volumes:
      - ./docker/mysql-test/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - apartar

  redis:
    ports:
      - "6380:6379"

  queue:
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  reverb:
    ports:
      - "8081:8080"
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app

  node:
    ports:
      - "5173:5173"
