services:
  app:
    build:
      context: .
      target: runtime
      args:
        VITE_APP_NAME: ${APP_NAME:-Apartar}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    image: apartar/app
    restart: unless-stopped
    mem_limit: 768m
    environment:
      CONTAINER_ROLE: app
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - apartar

  nginx:
    build:
      context: .
      target: web
      args:
        VITE_APP_NAME: ${APP_NAME:-Apartar}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    image: apartar/web
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - app_storage:/var/www/html/storage/app:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - apartar

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 1g
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-apartar}"
      MYSQL_USER: "${DB_USERNAME:-apartar}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - apartar

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - apartar

  queue:
    build:
      context: .
      target: runtime
      args:
        VITE_APP_NAME: ${APP_NAME:-Apartar}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    image: apartar/app
    restart: unless-stopped
    mem_limit: 512m
    environment:
      CONTAINER_ROLE: queue
    env_file:
      - .env
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=high,default,exports,telemetry
      - --tries=3
      - --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apartar

  reverb:
    build:
      context: .
      target: runtime
      args:
        VITE_APP_NAME: ${APP_NAME:-Apartar}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    image: apartar/app
    restart: unless-stopped
    mem_limit: 384m
    environment:
      CONTAINER_ROLE: reverb
    env_file:
      - .env
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - apartar

  node:
    image: node:22-alpine
    profiles:
      - dev
    restart: unless-stopped
    mem_limit: 1g
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - apartar

volumes:
  mysql_data:
  redis_data:
  app_storage:

networks:
  apartar:
    driver: bridge
