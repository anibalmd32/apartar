# Apartar — integración continua (REQ-QAX-004).
#
# Tres jobs en paralelo y los tres tienen que pasar para poder mezclar (RB-2).
# Ningún paso lleva `continue-on-error` (RB-5): un fallo bloquea la mezcla.
# El pipeline no despliega (RB-6), solo verifica.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # RB-3: dependencias con caché → pint --test → reglas estructurales → phpstan
  # → migrate → suite con el umbral de cobertura del dominio.
  #
  # Desde T-003b la suite corre en paralelo, con una base de datos por proceso
  # (`apartar_testing_test_1`, `_test_2`…). El usuario de MySQL de este job es
  # `root`, así que puede crearlas; el `migrate` de abajo deja lista la base
  # base, que es la que usa la ronda de concurrencia, que corre en serie.
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apartar_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, exif, gd, intl, pcntl, pdo_mysql, redis, zip
          # pcov y no xdebug: la cobertura del umbral de RB-3 se mide una vez
          # por job y pcov es un orden de magnitud más rápido.
          coverage: pcov

      # SP-2: la clave depende del lockfile, así que una caché corrupta se
      # invalida sola al cambiar las dependencias.
      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: cp .env.ci .env

      # T-003b · las cachés de PHPStan y de Pint cruzan ejecuciones. El
      # análisis frío cuesta unas tres veces lo que caliente, y las dos cachés
      # llevan dentro el contenido de cada archivo: una que no corresponda no
      # se reutiliza, se reconstruye. `restore-keys` deja partir de la anterior
      # aunque el código haya cambiado, que es el caso normal y donde más se
      # ahorra.
      - name: Caché del análisis estático
        uses: actions/cache@v4
        with:
          path: |
            storage/framework/phpstan
            storage/framework/pint.cache
          key: static-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('app/**', 'config/**', 'database/**', 'routes/**', 'tests/**', 'phpstan.neon', 'pint.json') }}
          restore-keys: |
            static-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Pint
        run: composer run lint

      # T-003b · los gates baratos van primero. Son reglas estructurales que no
      # se adivinan —entre ellas que cada clase de app/Domain y app/Actions
      # tenga su <Clase>Test— y descubrirlas al final de la suite cuesta la
      # pasada entera.
      - name: Reglas estructurales
        run: composer run test:quality

      - name: PHPStan nivel 6
        run: composer run analyse

      # SP-1: el servicio ya declara healthcheck; esto cubre la ventana entre
      # "mysqld responde" y "acepta la conexión de la aplicación".
      - name: Esperar a MySQL
        run: |
          for attempt in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL disponible tras $attempt intento(s)"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondió" >&2
          exit 1

      - name: Migrar
        run: php artisan migrate --force

      - name: Pest con umbral de cobertura del dominio
        run: composer run test:coverage

  # ---------------------------------------------------------------------------
  # RB-4: dependencias con caché → eslint → tsc --noEmit → vitest → vite build.
  # El build de producción entra aquí a propósito (SP-4).
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      # REQ-QAX-002 RB-10: el formato lo comprueba una receta, no la buena
      # voluntad. Es el equivalente de `pint --test` en el trabajo `backend`, y
      # hasta T-016 el script existía sin un solo llamante — con lo que el
      # `.prettierrc` era una guía de estilo que nada verificaba.
      - name: Prettier
        run: npm run format:check

      - name: Comprobación de tipos
        run: npm run types

      - name: Vitest
        run: npm run test

      - name: Build de producción
        run: npm run build

  # ---------------------------------------------------------------------------
  # RB-4b: job propio y separado de `backend` para que un fallo de aislamiento
  # sea inequívoco en el informe y no quede sepultado entre cientos de tests de
  # negocio. Es el único job cuyo fallo no admite discusión ni excepción.
  #
  # Tres pasos y en este orden: `migrate` deja el esquema puesto, `tenancy:audit`
  # recorre el código con las cinco comprobaciones de REQ-QAX-008 RB-4 y la
  # suite ejercita la fuga cruzada sobre las rutas registradas. La auditoría va
  # antes porque es de segundos y su fallo se lee de un vistazo: no tiene
  # sentido esperar a la suite para enterarse de que un modelo nuevo no lleva el
  # trait. `failOnEmptyTestSuite` en phpunit.xml impide que este job pueda
  # volverse verde sobre nada.
  # ---------------------------------------------------------------------------
  tenancy:
    name: tenancy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apartar_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, exif, gd, intl, pcntl, pdo_mysql, redis, zip
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: cp .env.ci .env

      - name: Esperar a MySQL
        run: |
          for attempt in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL disponible tras $attempt intento(s)"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondió" >&2
          exit 1

      - name: Migrar
        run: php artisan migrate --force

      - name: Auditoría estática de aislamiento
        run: composer run tenancy:audit

      - name: Suite de aislamiento
        run: composer run tenancy:suite
